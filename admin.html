<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSR Core Hub Workspace Dashboard Panel</title>
    <style>
        body { background: #0b0f19; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 50px 20px; }
        .admin-canvas-frame { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 45px; border-radius: 8px; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        h1 { font-size: 26px; color: #f8fafc; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.5px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 40px; }
        .segment-block { border-top: 1px solid #334155; padding-top: 30px; margin-top: 30px; }
        .segment-block h2 { font-size: 15px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; font-weight: 600; }
        .input-wrapper-node { margin-bottom: 22px; }
        label { display: block; font-size: 13px; font-weight: 500; color: #cbd5e1; margin-bottom: 8px; }
        input[type="text"], textarea { width: 100%; background: #0f172a; border: 1px solid #475569; padding: 14px; border-radius: 4px; color: #ffffff; font-size: 14px; transition: border-color 0.2s ease; }
        input[type="text"]:focus, textarea:focus { border-color: #38bdf8; outline: none; }
        .commit-sync-btn { background: #2563eb; color: #ffffff; border: none; width: 100%; padding: 18px; font-size: 14px; font-weight: 700; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: background 0.2s ease; margin-top: 20px; }
        .commit-sync-btn:hover { background: #1d4ed8; }
        .notification-toast { position: fixed; bottom: 30px; right: 30px; background: #10b981; color: #ffffff; padding: 14px 28px; border-radius: 4px; font-size: 14px; font-weight: 600; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div class="admin-canvas-frame">
        <h1>RSR Core Hub Workspace Dashboard</h1>
        <p>Modify non-technical content data. Save changes to update your luxury storefront view instantly.</p>

        <form id="admin-panel-form">
            <div class="segment-block">
                <h2>1. Layout Headers & Announcements</h2>
                <div class="input-wrapper-node">
                    <label>Sleek Endless Luxury Marquee Banner Text Content String</label>
                    <input type="text" id="marquee" value="Exclusive Festive Collections Now Live • Wholesale Price @ Retail Showroom • Premium Tailoring & Luxury Apparel">
                </div>
            </div>

            <div class="segment-block">
                <h2>2. Welcome View Layout Configurations</h2>
                <div class="input-wrapper-node">
                    <label>Subheading Tag Badge</label>
                    <input type="text" id="homeTag" value="Wholesale Price @ Retail Showroom">
                </div>
                <div class="input-wrapper-node">
                    <label>Main Showcase Headline Title</label>
                    <input type="text" id="homeTitle" value="The Ultimate Heritage Luxury Experience">
                </div>
                <div class="input-wrapper-node">
                    <label>Description Narrative Text Block</label>
                    <textarea id="homeDesc" rows="3">Step into the absolute standard of fine luxury garments. Discover exquisite masterwork catalog collections tailored completely to look magnificent across your landmark celebratory occasions.</textarea>
                </div>
                <div class="input-wrapper-node">
                    <label>Welcome View Main Display Image URL Asset Path</label>
                    <input type="text" id="imgHome" value="https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=800&q=80">
                </div>
            </div>

            <div class="segment-block">
                <h2>3. Production Category Real Images Override</h2>
                <div class="input-wrapper-node">
                    <label>Pure Silk Sarees Grid Variant Item 01 Image URL Link</label>
                    <input type="text" id="imgSilk1" value="https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=600&q=80">
                </div>
                <div class="input-wrapper-node">
                    <label>Brocade Silk Sarees Grid Variant Item 02 Image URL Link</label>
                    <input type="text" id="imgSilk2" value="https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?auto=format&fit=crop&w=600&q=80">
                </div>
                <div class="input-wrapper-node">
                    <label>Imperial Men Suits Custom Blazer Variant Item 01 Image URL Link</label>
                    <input type="text" id="imgMen1" value="https://images.unsplash.com/photo-1593032465175-481da7f4016b?auto=format&fit=crop&w=600&q=80">
                </div>
                <div class="input-wrapper-node">
                    <label>Traditional Sherwani Men Suit Variant Item 02 Image URL Link</label>
                    <input type="text" id="imgMen2" value="https://images.unsplash.com/photo-1617137968427-85924c800a22?auto=format&fit=crop&w=600&q=80">
                </div>
                <div class="input-wrapper-node">
                    <label>Designer Bridal Women Wear Variant Item 01 Image URL Link</label>
                    <input type="text" id="imgWomen1" value="https://images.unsplash.com/photo-1583391265517-35bbdba01229?auto=format&fit=crop&w=600&q=80">
                </div>
                <div class="input-wrapper-node">
                    <label>Flagship About Heritage Showroom Section Main Image URL Link</label>
                    <input type="text" id="imgAbout" value="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=800&q=80">
                </div>
            </div>

            <button type="button" class="commit-sync-btn" onclick="commitWorkspaceSynchronizationData()">Sync Workspace Changes</button>
        </form>
    </div>

    <div class="notification-toast" id="admin-toast">Data Synchronized Successfully!</div>

    <script>
        function commitWorkspaceSynchronizationData() {
            const structuralConfigData = {
                marquee: document.getElementById('marquee').value,
                homeTag: document.getElementById('homeTag').value,
                homeTitle: document.getElementById('homeTitle').value,
                homeDesc: document.getElementById('homeDesc').value,
                imgHome: document.getElementById('imgHome').value,
                imgSilk1: document.getElementById('imgSilk1').value,
                imgSilk2: document.getElementById('imgSilk2').value,
                imgMen1: document.getElementById('imgMen1').value,
                imgMen2: document.getElementById('imgMen2').value,
                imgWomen1: document.getElementById('imgWomen1').value,
                imgAbout: document.getElementById('imgAbout').value
            };
            
            localStorage.setItem('rsr_luxury_config', JSON.stringify(structuralConfigData));
            
            const toastNode = document.getElementById('admin-toast');
            toastNode.style.display = 'block';
            setTimeout(() => { toastNode.style.display = 'none'; }, 2500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const cachedArrayString = localStorage.getItem('rsr_luxury_config');
            if (cachedArrayString) {
                const objectParsed = JSON.parse(cachedArrayString);
                Object.keys(objectParsed).forEach(key => {
                    const inputFieldElement = document.getElementById(key);
                    if (inputFieldElement) inputFieldElement.value = objectParsed[key];
                });
            }
        });
    </script>
</body>
</html>
